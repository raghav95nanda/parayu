name: Publish Parayu to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Supabase client
        run: npm ci --ignore-scripts
      - name: Assemble app and bundled Malayalam audio
        run: python scripts/build-site.py
        env:
          PARAYU_SUPABASE_URL: ${{ vars.PARAYU_SUPABASE_URL }}
          PARAYU_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PARAYU_SUPABASE_PUBLISHABLE_KEY }}
      - name: Check PWA, content, lessons, and audio
        run: |
          node tests/pwa.mjs
          node tests/account.mjs
          node tests/breakdowns.mjs
          node tests/learning-flow.mjs
          node tests/vocabulary.mjs
          node tests/pronunciation.mjs
          node tests/offline-audio.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
